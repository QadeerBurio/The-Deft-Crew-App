# One "back": the Android back button, or the iOS edge swipe (plan Q-2: both must work on every pushed screen).
appId: com.aqkhan110.tdc
---
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 1%, 50%
          end: 80%, 50%
          duration: 300
