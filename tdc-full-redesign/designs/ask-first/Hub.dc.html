<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hub deals</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#000000}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #FAF8F3; font-family: 'DM Sans', sans-serif; color: #111111; overflow: hidden">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 22px 20px 0">
<h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.8px">hub<span style="color: {{accent}}">.</span></h1>
<button aria-label="search deals" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #ECE7DB; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
</header>

<div style="padding: 16px 20px 0">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 24px; background: #F0ECE2">
<a href="Hub.dc.html" style="height: 40px; border-radius: 20px; background: #111111; color: #FFFFFF; font-weight: 700; font-size: 14px; text-decoration: none; display: flex; align-items: center; justify-content: center">deals</a>
<a href="Events.dc.html" style="height: 40px; border-radius: 20px; color: #111111; font-weight: 600; font-size: 14px; text-decoration: none; display: flex; align-items: center; justify-content: center">events</a>
<a href="Wall.dc.html" style="height: 40px; border-radius: 20px; color: #111111; font-weight: 600; font-size: 14px; text-decoration: none; display: flex; align-items: center; justify-content: center">the wall</a>
</div>
</div>

<div style="display: flex; gap: 8px; padding: 16px 20px 0; overflow: hidden">
<button style="flex-shrink: 0; height: 38px; padding: 0 12px; border-radius: 19px; border: 0; background: {{accent}}; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 4px">karachi<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
<sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
<button onClick="{{c.pick}}" style="flex-shrink: 0; height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-weight: 600; font-size: 14px">{{c.label}}</button>
</sc-for>
</div>

<p style="margin: 14px 20px 0; font-size: 13px; color: #6B675E">flat discounts. every visit. no expiry drama.</p>

<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 20px 0">
<sc-for list="{{brands}}" as="b" hint-placeholder-count="6">
<a href="Deal.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 20px; background: #FFFFFF; border: 1px solid #ECE7DB; text-decoration: none; color: #111111">
<span style="width: 48px; height: 48px; border-radius: 14px; background: #F0ECE2; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #6B675E; flex-shrink: 0">[LOGO]</span>
<span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 700; font-size: 15px">{{b.name}}</span><span style="display: block; font-size: 13px; color: #6B675E; margin-top: 2px">{{b.meta}}</span></span>
<span style="height: 28px; padding: 0 10px; border-radius: 14px; background: {{accent}}; font-size: 12.5px; font-weight: 800; display: flex; align-items: center">{{b.off}}</span>
</a>
</sc-for>
</div>

<div style="position: absolute; left: 0; bottom: 0"><dc-import name="Nav" active="hub" accent="{{accent}}" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F9C349"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cat: 'all' }; }
  renderVals() {
    const cats = ['all', 'food', 'cafes', 'fashion', 'salons', 'gyms', 'fun'].map((label) => {
      const on = this.state.cat === label;
      return { label, bg: on ? '#111111' : '#FFFFFF', fg: on ? '#FFFFFF' : '#111111', border: on ? '#111111' : '#ECE7DB', pick: () => this.setState({ cat: label }) };
    });
    const brands = [
      { name: 'Jenpharm', meta: 'skincare · order online', off: '10% off' },
      { name: '[BRAND]', meta: 'cafe · dha phase 6 · 1.2 km', off: '[X]% off' },
      { name: '[BRAND]', meta: 'fashion · clifton · 3 km', off: '[X]% off' },
      { name: '[BRAND]', meta: 'gym · bahadurabad · 5 km', off: '[X]% off' },
      { name: '[BRAND]', meta: 'salon · gulshan · 6 km', off: '[X]% off' },
      { name: '[BRAND]', meta: 'fun · do darya · 7 km', off: '[X]% off' }
    ];
    return { accent: this.props.accent ?? '#F9C349', cats, brands };
  }
}
</script>
</body>
</html>
