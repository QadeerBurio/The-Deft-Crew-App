<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>the crew</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#000000}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #FAF8F3; font-family: 'DM Sans', sans-serif; color: #111111; overflow: hidden">

<header style="display: flex; align-items: center; gap: 10px; padding: 18px 16px 0">
<a href="Profile.dc.html" aria-label="back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #ECE7DB; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; flex: 1; font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.8px">the crew<span style="color: {{accent}}">.</span></h1>
<a href="Rewards.dc.html" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #ECE7DB; background: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 13px; display: flex; align-items: center">rewards</a>
</header>

<section style="padding: 16px 16px 0">
<div style="border-radius: 28px; background: #111111; color: #FFFFFF; padding: 20px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 52px; height: 52px; border-radius: 26px; background: {{accent}}; flex-shrink: 0"></span>
<div style="flex: 1"><div style="font-size: 11px; font-weight: 700; letter-spacing: 0.2px; color: #A39E92">your points</div><div style="font-family: 'Outfit', sans-serif; font-size: 34px; font-weight: 800; line-height: 1.05">1,240</div><div style="font-size: 12px; color: #A39E92">lifetime · 860 to spend</div></div>
</div>
<div style="display: flex; justify-content: space-between; margin-top: 16px; font-size: 13px"><span style="font-weight: 700; color: {{accent}}">main character.</span><span style="color: #A39E92">next: pro at 3,000</span></div>
<div style="height: 6px; border-radius: 3px; background: #2A2925; margin-top: 8px; overflow: hidden"><div style="height: 6px; width: 41%; background: {{accent}}"></div></div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; margin-top: 16px">
<sc-for list="{{levels}}" as="l" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
<span style="width: 28px; height: 28px; border-radius: 14px; background: {{l.bg}}; border: 2px solid {{l.border}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #111111">{{l.n}}</span>
<span style="font-size: 10.5px; font-weight: 700; line-height: 1.15; color: {{l.c}}">{{l.name}}</span>
</div>
</sc-for>
</div>
</div>
</section>

<section style="padding: 12px 16px 0">
<div style="border-radius: 24px; background: #FFFFFF; border: 1px solid #ECE7DB; padding: 16px">
<div style="font-size: 11px; font-weight: 700; letter-spacing: 0.2px; color: #6B675E">your code</div>
<div style="display: flex; align-items: center; gap: 8px; margin-top: 8px">
<div style="flex: 1; height: 50px; border-radius: 16px; border: 1.5px dashed #ECE7DB; display: flex; align-items: center; padding: 0 14px; font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 2px">[CODE]</div>
<button aria-label="copy code" style="width: 50px; height: 50px; border-radius: 16px; border: 1px solid #ECE7DB; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg></button>
</div>
<p style="margin: 10px 0 0; font-size: 13px; color: #6B675E">tell a friend. crew points come with them. only real use counts.</p>
<button style="margin-top: 12px; width: 100%; height: 48px; border-radius: 24px; border: 0; background: #111111; color: #FFFFFF; font-weight: 700; font-size: 15px">share my code</button>
</div>
</section>

<section style="padding: 12px 16px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<div style="border-radius: 22px; background: #FFFFFF; border: 1px solid #ECE7DB; padding: 14px">
<div style="font-size: 11px; font-weight: 700; letter-spacing: 0.2px; color: #6B675E">your crew</div>
<div style="display: flex; align-items: center; margin-top: 8px">
<span style="width: 30px; height: 30px; border-radius: 15px; background: #FFF1CC; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800">H</span>
<span style="width: 30px; height: 30px; border-radius: 15px; background: #F0ECE2; border: 2px solid #FFFFFF; margin-left: -8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800">S</span>
<span style="width: 30px; height: 30px; border-radius: 15px; background: {{accent}}; border: 2px solid #FFFFFF; margin-left: -8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800">+4</span>
</div>
<div style="font-size: 13px; font-weight: 700; margin-top: 6px">6 members</div>
</div>
<a href="#" style="border-radius: 22px; background: #FFF1CC; padding: 14px; text-decoration: none; color: #111111; display: flex; flex-direction: column; justify-content: space-between">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.2px">founder circle</span>
<span style="font-size: 13px; line-height: 1.35">50 seats. msb reviews each one personally.</span>
<span style="font-weight: 800; font-size: 13px">apply at 8,000</span>
</a>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F9C349"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#F9C349';
    const levels = [
      { name: 'rookie', s: 'done' }, { name: 'main character', s: 'now' }, { name: 'pro', s: 'next' }, { name: 'goat', s: 'next' }, { name: 'founder circle', s: 'next' }
    ].map((l, i) => ({ ...l, n: i + 1, bg: l.s === 'next' ? '#2A2925' : accent, border: l.s === 'now' ? '#FFFFFF' : (l.s === 'done' ? accent : '#2A2925'), c: l.s === 'next' ? '#736E65' : '#FFFFFF' }));
    return { accent, levels };
  }
}
</script>
</body>
</html>
