<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>the wall</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#000000}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #FAF8F3; font-family: 'DM Sans', sans-serif; color: #111111; overflow: hidden">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 22px 20px 0">
<h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.8px">hub<span style="color: {{accent}}">.</span></h1>
<button aria-label="new post" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #111111; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
</header>

<div style="padding: 16px 20px 0">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 24px; background: #F0ECE2">
<a href="Hub.dc.html" style="height: 40px; border-radius: 20px; color: #111111; font-weight: 600; font-size: 14px; text-decoration: none; display: flex; align-items: center; justify-content: center">deals</a>
<a href="Events.dc.html" style="height: 40px; border-radius: 20px; color: #111111; font-weight: 600; font-size: 14px; text-decoration: none; display: flex; align-items: center; justify-content: center">events</a>
<a href="Wall.dc.html" style="height: 40px; border-radius: 20px; background: #111111; color: #FFFFFF; font-weight: 700; font-size: 14px; text-decoration: none; display: flex; align-items: center; justify-content: center">the wall</a>
</div>
</div>

<div style="display: flex; gap: 20px; padding: 18px 24px 0">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
<button onClick="{{m.pick}}" style="border: 0; background: transparent; padding: 0 0 6px; font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 800; color: {{m.fg}}; border-bottom: 3px solid {{m.line}}">{{m.label}}</button>
</sc-for>
</div>

<div style="padding: 14px 20px 0">
<label style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 8px 0 10px; border-radius: 26px; background: #FFFFFF; border: 1px solid #ECE7DB">
<dc-import name="Dot" mood="{{composerMood}}" size="32" accent="{{accent}}" hint-size="32px,32px"></dc-import>
<input aria-label="write a post" placeholder="{{placeholder}}" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 15px; color: #111111">
<span style="height: 36px; padding: 0 14px; border-radius: 18px; background: #111111; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center">post</span>
</label>
</div>

<div style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{posts}}" as="p" hint-placeholder-count="3">
<article style="border-radius: 22px; background: {{p.bg}}; color: {{p.fg}}; border: 1px solid {{p.border}}; padding: 14px 16px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 34px; height: 34px; border-radius: 17px; background: {{p.avatarBg}}; color: #111111; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px">{{p.initial}}</span>
<span style="flex: 1"><span style="display: block; font-weight: 700; font-size: 14px">{{p.who}}</span><span style="display: block; font-size: 12px; color: {{p.muted}}">{{p.meta}}</span></span>
</div>
<p style="margin: 10px 0 0; font-size: 15px; line-height: 1.45">{{p.text}}</p>
<div style="display: flex; gap: 16px; margin-top: 10px; font-size: 13px; font-weight: 600; color: {{p.muted}}">
<span style="display: flex; align-items: center; gap: 5px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{p.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10Z"></path></svg>{{p.likes}}</span>
<span style="display: flex; align-items: center; gap: 5px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{p.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.8 7L4 20l1-4.6A8 8 0 1 1 21 12Z"></path></svg>{{p.comments}}</span>
</div>
</article>
</sc-for>
</div>

<div style="position: absolute; left: 0; bottom: 0"><dc-import name="Nav" active="hub" accent="{{accent}}" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F9C349"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'feed' }; }
  renderVals() {
    const accent = this.props.accent ?? '#F9C349';
    const conf = this.state.mode === 'confessions';
    const modes = ['feed', 'confessions'].map((label) => {
      const on = this.state.mode === label;
      return { label, fg: on ? '#111111' : '#736E65', line: on ? accent : 'transparent', pick: () => this.setState({ mode: label }) };
    });
    const light = { bg: '#FFFFFF', fg: '#111111', border: '#ECE7DB', muted: '#6B675E', avatarBg: '#FFF1CC' };
    const dark = { bg: '#111111', fg: '#FFFFFF', border: '#111111', muted: '#CFCAC0', avatarBg: accent };
    const feed = [
      { initial: 'A', who: '[NAME]', meta: '[UNIVERSITY] · 2h', text: 'anyone up for a study group for finals this weekend? library, 4 pm.', likes: 24, comments: 9 },
      { initial: 'H', who: '[NAME]', meta: '[UNIVERSITY] · 5h', text: 'just got my first internship through tdc. still processing.', likes: 61, comments: 14 },
      { initial: 'S', who: '[NAME]', meta: '[UNIVERSITY] · 1d', text: 'best cafe near campus for working all day? go.', likes: 18, comments: 27 }
    ].map((p) => ({ ...p, ...light }));
    const confessions = [
      { initial: '?', who: 'anon.', meta: 'confession · 1h', text: 'i have attended every class this semester and still have no idea what the course is about.', likes: 88, comments: 31 },
      { initial: '?', who: 'anon.', meta: 'confession · 3h', text: 'i told my parents the trip was a "study retreat".', likes: 142, comments: 40 },
      { initial: '?', who: 'anon.', meta: 'confession · 6h', text: 'the canteen chips are the only reason i come to uni.', likes: 57, comments: 12 }
    ].map((p) => ({ ...p, ...dark }));
    return {
      accent, modes,
      posts: conf ? confessions : feed,
      placeholder: conf ? 'confess. nobody will know.' : 'say something.',
      composerMood: conf ? 'sus' : 'cheeky'
    };
  }
}
</script>
</body>
</html>
