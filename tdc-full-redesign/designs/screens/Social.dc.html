<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>social feed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#000000}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #FAF8F3; font-family: 'DM Sans', sans-serif; color: #111111; overflow: hidden">

<header style="display: flex; align-items: center; gap: 10px; padding: 18px 16px 0">
<a href="Main.dc.html" aria-label="back to home" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #ECE7DB; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; flex: 1; font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.8px">social<span style="color: {{accent}}">.</span></h1>
<button aria-label="notifications" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #ECE7DB; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></button>
</header>

<div style="padding: 14px 16px 0">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 24px; background: #F0ECE2">
<a href="Social.dc.html" style="height: 40px; border-radius: 20px; background: #111111; color: #FFFFFF; font-weight: 700; font-size: 14px; text-decoration: none; display: flex; align-items: center; justify-content: center">feed</a>
<a href="Confessions.dc.html" style="height: 40px; border-radius: 20px; color: #111111; font-weight: 600; font-size: 14px; text-decoration: none; display: flex; align-items: center; justify-content: center">confessions</a>
</div>
</div>

<div style="display: flex; gap: 12px; padding: 16px 16px 0; overflow: hidden">
<a href="CreatePost.dc.html" style="flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; color: #111111">
<span style="width: 60px; height: 60px; border-radius: 30px; border: 2px dashed #ECE7DB; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span>
<span style="font-size: 11.5px; font-weight: 600">your story</span>
</a>
<sc-for list="{{stories}}" as="s" hint-placeholder-count="4">
<span style="flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px">
<span style="width: 60px; height: 60px; border-radius: 30px; padding: 3px; box-sizing: border-box; background: {{s.ring}}"><span style="display: flex; width: 100%; height: 100%; border-radius: 30px; border: 2px solid #FAF8F3; box-sizing: border-box; background: {{s.bg}}; align-items: center; justify-content: center; font-weight: 800; font-size: 16px">{{s.i}}</span></span>
<span style="font-size: 11.5px; font-weight: 600">{{s.name}}</span>
</span>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 16px 16px 0">
<sc-for list="{{posts}}" as="p" hint-placeholder-count="2">
<article style="border-radius: 24px; background: #FFFFFF; border: 1px solid #ECE7DB; padding: 14px 16px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 38px; height: 38px; border-radius: 19px; background: #FFF1CC; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px">{{p.i}}</span>
<span style="flex: 1"><span style="display: flex; align-items: center; gap: 4px; font-weight: 700; font-size: 14px">{{p.who}}<svg width="14" height="14" viewBox="0 0 24 24" fill="{{accent}}" stroke="#111111" stroke-width="1.6"><path d="m12 2 2.4 2.1 3.2-.3.8 3.1 2.8 1.6-1.3 2.9 1.3 2.9-2.8 1.6-.8 3.1-3.2-.3L12 22l-2.4-2.1-3.2.3-.8-3.1-2.8-1.6 1.3-2.9-1.3-2.9 2.8-1.6.8-3.1 3.2.3Z"></path></svg></span><span style="display: block; font-size: 12px; color: #6B675E">{{p.meta}}</span></span>
<button aria-label="more" style="width: 36px; height: 36px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="#6B675E"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
</div>
<p style="margin: 10px 0 0; font-size: 15px; line-height: 1.45">{{p.text}}</p>
<div style="display: flex; gap: 6px; margin-top: 12px">
<button onClick="{{p.like}}" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid {{p.likeBorder}}; background: {{p.likeBg}}; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; color: #111111"><svg width="15" height="15" viewBox="0 0 24 24" fill="{{p.heartFill}}" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10Z"></path></svg>{{p.likes}}</button>
<span style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #ECE7DB; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.8 7L4 20l1-4.6A8 8 0 1 1 21 12Z"></path></svg>{{p.comments}}</span>
<span style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #ECE7DB; font-size: 13px; font-weight: 700; display: flex; align-items: center">share</span>
</div>
</article>
</sc-for>
</div>

<nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #111111; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; padding-top: 12px; box-sizing: border-box">
<sc-for list="{{inner}}" as="n" hint-placeholder-count="5">
<a href="{{n.href}}" aria-label="{{n.label}}" style="justify-self: center; width: {{n.size}}; height: {{n.size}}; margin-top: {{n.mt}}; border-radius: 22px; background: {{n.bg}}; display: flex; align-items: center; justify-content: center; position: relative">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{n.c}}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.icon}}"></path></svg>
<span style="position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 4px; background: {{n.badge}}"></span>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F9C349"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { liked: {} }; }
  renderVals() {
    const accent = this.props.accent ?? '#F9C349';
    const stories = [['A', 'aiman', true], ['H', 'hamza', true], ['S', 'sana', false], ['R', 'rafay', false]].map(([i, name, fresh]) => ({ i, name, ring: fresh ? accent : '#ECE7DB', bg: '#FFF1CC' }));
    const raw = [
      { id: 1, i: 'A', who: '[NAME]', meta: '[UNIVERSITY] · 2h', text: 'study group for finals this weekend? library, 4 pm. bring snacks.', likes: 24, comments: 9 },
      { id: 2, i: 'H', who: '[NAME]', meta: '[UNIVERSITY] · 5h', text: 'got my first internship through tdc. still processing it.', likes: 61, comments: 14 }
    ];
    const posts = raw.map((p) => {
      const on = !!this.state.liked[p.id];
      return { ...p, likes: p.likes + (on ? 1 : 0), heartFill: on ? accent : 'none', likeBg: on ? '#FFF1CC' : '#FFFFFF', likeBorder: on ? accent : '#ECE7DB', like: () => this.setState({ liked: { ...this.state.liked, [p.id]: !on } }) };
    });
    const inner = [
      { label: 'feed', href: 'Social.dc.html', icon: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1Z', c: accent },
      { label: 'search', href: '#', icon: 'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14ZM20 20l-3.5-3.5', c: '#736E65' },
      { label: 'create post', href: 'CreatePost.dc.html', icon: 'M12 5v14M5 12h14', c: '#111111', bg: accent, size: '52px', mt: '-2px' },
      { label: 'messages', href: '#', icon: 'M21 12a8 8 0 0 1-11.8 7L4 20l1-4.6A8 8 0 1 1 21 12Z', c: '#736E65', badge: accent },
      { label: 'my profile', href: 'Profile.dc.html', icon: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4 21a8 8 0 0 1 16 0', c: '#736E65' }
    ].map((n) => ({ bg: 'transparent', size: '48px', mt: '0', badge: 'transparent', ...n }));
    return { accent, stories, posts, inner };
  }
}
</script>
</body>
</html>
