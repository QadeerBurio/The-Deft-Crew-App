<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tdc ai</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#000000}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #FAF8F3; font-family: 'DM Sans', sans-serif; color: #111111; overflow: hidden">

<header style="display: flex; align-items: center; gap: 12px; padding: 18px 20px 0">
<a href="Main.dc.html" aria-label="back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #ECE7DB; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; flex: 1; font-family: 'Outfit', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -0.6px">tdc ai<span style="color: {{accent}}">.</span></h1>
<dc-import name="Dot" mood="excited" size="40" accent="{{accent}}" hint-size="40px,40px"></dc-import>
</header>

<div style="display: flex; gap: 8px; padding: 16px 20px 0">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="4">
<button onClick="{{m.pick}}" style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid {{m.border}}; background: {{m.bg}}; color: {{m.fg}}; font-weight: 600; font-size: 14px">{{m.label}}</button>
</sc-for>
</div>

<div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 12px">
<div style="align-self: flex-end; max-width: 270px; padding: 12px 14px; border-radius: 20px 20px 6px 20px; background: #111111; color: #FFFFFF; font-size: 15px; line-height: 1.45">3 day trip to hunza with 4 friends. budget around [RS] each.</div>

<div style="align-self: flex-start; width: 300px; padding: 14px; border-radius: 20px 20px 20px 6px; background: #FFFFFF; border: 1px solid #ECE7DB">
<div style="font-weight: 700; font-size: 15px">sorted<span style="color: #B8860B">.</span> here's a plan.</div>
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="3">
<div style="display: flex; gap: 10px; align-items: flex-start">
<span style="flex-shrink: 0; height: 24px; padding: 0 8px; border-radius: 12px; background: {{accent}}; font-size: 12px; font-weight: 800; display: flex; align-items: center">{{d.day}}</span>
<span style="font-size: 14px; line-height: 1.4">{{d.plan}}</span>
</div>
</sc-for>
</div>
<div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #F0ECE2; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; text-align: center">
<div><div style="font-size: 11px; color: #6B675E">travel</div><div style="font-weight: 700; font-size: 13px">[RS]</div></div>
<div><div style="font-size: 11px; color: #6B675E">stay</div><div style="font-weight: 700; font-size: 13px">[RS]</div></div>
<div><div style="font-size: 11px; color: #6B675E">food</div><div style="font-weight: 700; font-size: 13px">[RS]</div></div>
</div>
</div>

<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #ECE7DB; background: #FFFFFF; font-size: 13px; font-weight: 600">make it cheaper</button>
<button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #ECE7DB; background: #FFFFFF; font-size: 13px; font-weight: 600">packing list</button>
<button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #ECE7DB; background: #FFFFFF; font-size: 13px; font-weight: 600">share with crew</button>
</div>
<p style="margin: 0; font-size: 12px; color: #6B675E">tdc ai plans it. you book it.</p>
</div>

<div style="position: absolute; left: 16px; right: 16px; bottom: 24px; height: 58px; border-radius: 29px; background: #FFFFFF; border: 1px solid #ECE7DB; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 18px; box-shadow: 0 6px 20px rgba(17,17,17,0.06)">
<input aria-label="message tdc ai" placeholder="ask anything" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 15px; color: #111111">
<button aria-label="send" style="width: 46px; height: 46px; border-radius: 23px; border: 0; background: #111111; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F9C349"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'travel' }; }
  renderVals() {
    const modes = ['travel', 'career', 'deals', 'anything'].map((label) => {
      const on = this.state.mode === label;
      return { label, bg: on ? '#111111' : '#FFFFFF', fg: on ? '#FFFFFF' : '#111111', border: on ? '#111111' : '#ECE7DB', pick: () => this.setState({ mode: label }) };
    });
    const days = [
      { day: 'day 1', plan: 'islamabad to [STOP]. leave early, overnight in [TOWN].' },
      { day: 'day 2', plan: 'drive up to karimabad. sunset at [VIEWPOINT].' },
      { day: 'day 3', plan: 'attabad lake in the morning, head back by noon.' }
    ];
    return { accent: this.props.accent ?? '#F9C349', modes, days };
  }
}
</script>
</body>
</html>
