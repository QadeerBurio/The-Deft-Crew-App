<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>create post</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#000000}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #FAF8F3; font-family: 'DM Sans', sans-serif; color: #111111; overflow: hidden">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 0">
<a href="Social.dc.html" style="height: 44px; padding: 0 4px; display: flex; align-items: center; text-decoration: none; font-weight: 600; font-size: 15px; color: #6B675E">cancel</a>
<span style="font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 800">new post<span style="color: {{accent}}">.</span></span>
<a href="Social.dc.html" style="height: 40px; padding: 0 18px; border-radius: 20px; background: {{postBg}}; color: {{postFg}}; text-decoration: none; font-weight: 800; font-size: 14px; display: flex; align-items: center">post</a>
</header>

<div style="padding: 18px 16px 0">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 24px; background: #F0ECE2">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
<button onClick="{{m.pick}}" style="height: 40px; border-radius: 20px; border: 0; background: {{m.bg}}; color: {{m.fg}}; font-weight: {{m.weight}}; font-size: 14px">{{m.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; align-items: center; gap: 10px; padding: 18px 20px 0">
<sc-if value="{{anon}}" hint-placeholder-val="{{ false }}"><span style="width: 40px; height: 40px; border-radius: 20px; background: #111111; color: {{accent}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px">?</span></sc-if>
<sc-if value="{{named}}" hint-placeholder-val="{{ true }}"><span style="width: 40px; height: 40px; border-radius: 20px; background: {{accent}}; display: flex; align-items: center; justify-content: center; font-weight: 800">A</span></sc-if>
<span><span style="display: block; font-weight: 700; font-size: 14px">{{who}}</span><span style="display: block; font-size: 12px; color: #6B675E">{{whoSub}}</span></span>
</div>

<div style="padding: 14px 20px 0">
<textarea aria-label="write your post" placeholder="{{placeholder}}" style="width: 100%; height: 220px; box-sizing: border-box; border: 0; outline: 0; resize: none; background: transparent; font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 600; line-height: 1.3; color: #111111"></textarea>
</div>

<div style="padding: 0 16px; display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tags}}" as="t" hint-placeholder-count="5">
<span style="height: 34px; padding: 0 12px; border-radius: 17px; background: #FFFFFF; border: 1px solid #ECE7DB; font-size: 13px; font-weight: 600; display: flex; align-items: center">#{{t}}</span>
</sc-for>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 28px; background: #FFFFFF; border-top: 1px solid #ECE7DB; display: flex; align-items: center; gap: 8px">
<button aria-label="add photo" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #ECE7DB; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4ZM4 16l5-5 4 4 3-3 4 4M15 9h.01"></path></svg></button>
<button aria-label="add poll" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #ECE7DB; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"></path></svg></button>
<span style="flex: 1; text-align: right; font-size: 12.5px; color: #6B675E">keep it kind. read the guidelines.</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F9C349"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'post' }; }
  renderVals() {
    const accent = this.props.accent ?? '#F9C349';
    const anon = this.state.mode === 'confession';
    const modes = ['post', 'confession'].map((label) => {
      const on = this.state.mode === label;
      return { label, bg: on ? '#111111' : 'transparent', fg: on ? '#FFFFFF' : '#111111', weight: on ? 700 : 600, pick: () => this.setState({ mode: label }) };
    });
    return {
      accent, modes, anon, named: !anon,
      who: anon ? 'anon.' : '[FULL NAME]',
      whoSub: anon ? 'your name stays hidden. always.' : 'posting to [UNIVERSITY] and the crew',
      placeholder: anon ? 'say the thing you can’t say out loud.' : 'what’s happening on campus?',
      tags: anon ? ['campus', 'love', 'money', 'family', 'exams'] : ['study', 'events', 'help', 'wins', 'random'],
      postBg: '#111111', postFg: '#FFFFFF'
    };
  }
}
</script>
</body>
</html>
