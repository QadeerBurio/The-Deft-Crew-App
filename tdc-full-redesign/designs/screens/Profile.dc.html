<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#000000}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #FAF8F3; font-family: 'DM Sans', sans-serif; color: #111111; overflow: hidden">

<section style="background: #111111; color: #FFFFFF; padding: 22px 20px 64px; border-radius: 0 0 32px 32px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.2px; color: #A39E92">profile</span>
<a href="#" aria-label="settings" style="width: 40px; height: 40px; border-radius: 20px; background: #1A1916; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg></a>
</div>
<div style="display: flex; align-items: center; gap: 14px; margin-top: 14px">
<span style="position: relative; width: 72px; height: 72px; border-radius: 36px; background: {{accent}}; color: #111111; display: flex; align-items: center; justify-content: center; font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 800">A
<span style="position: absolute; right: -2px; bottom: -2px; width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; border: 2px solid #111111; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4ZM12 16a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"></path></svg></span></span>
<span style="flex: 1"><span style="display: block; font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 800">[FULL NAME]</span><span style="display: block; font-size: 13px; color: #CFCAC0; margin-top: 2px">[UNIVERSITY] · verified student</span>
<span style="display: inline-flex; margin-top: 8px; height: 24px; padding: 0 10px; border-radius: 12px; background: #1A1916; color: {{accent}}; font-size: 12px; font-weight: 700; align-items: center">main character.</span></span>
</div>
</section>

<section style="margin: -44px 16px 0; position: relative; border-radius: 26px; background: #FFFFFF; border: 1px solid #ECE7DB; padding: 16px; display: flex; align-items: center; gap: 12px">
<span style="width: 52px; height: 52px; border-radius: 16px; background: #FFF1CC; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h13v4M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2ZM16 14.5h.01"></path></svg></span>
<span style="flex: 1"><span style="display: block; font-size: 12px; color: #6B675E">my tdc savings</span><span style="display: block; font-family: 'Outfit', sans-serif; font-size: 26px; font-weight: 800">rs [X]<span style="color: {{accent}}">.</span></span></span>
<a href="MyDiscounts.dc.html" style="height: 38px; padding: 0 14px; border-radius: 19px; background: #111111; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 13px; display: flex; align-items: center">details</a>
</section>

<section style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px 16px 0">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="3">
<a href="{{t.href}}" style="border-radius: 20px; background: #FFFFFF; border: 1px solid #ECE7DB; padding: 14px 10px; text-decoration: none; color: #111111; text-align: center">
<span style="display: block; font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 800">{{t.n}}</span>
<span style="display: block; font-size: 12px; color: #6B675E; margin-top: 2px">{{t.label}}</span>
</a>
</sc-for>
</section>

<section style="padding: 12px 16px 0">
<div style="border-radius: 22px; background: #FFFFFF; border: 1px solid #ECE7DB; overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<a href="{{r.href}}" style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; border-top: {{r.line}}; text-decoration: none; color: #111111">
<span style="width: 34px; height: 34px; border-radius: 12px; background: #F5F2EA; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg></span>
<span style="flex: 1"><span style="display: block; font-weight: 700; font-size: 14.5px">{{r.label}}</span><span style="display: block; font-size: 12px; color: #6B675E">{{r.sub}}</span></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#736E65" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>
</a>
</sc-for>
</div>
<a href="SignIn.dc.html" style="display: block; text-align: center; padding: 12px; font-size: 14px; font-weight: 700; color: #B42318; text-decoration: none">sign out</a>
</section>

<div style="position: absolute; left: 0; bottom: 0"><dc-import name="Nav" active="profile" accent="{{accent}}" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F9C349"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#F9C349';
    const tiles = [['1,240', 'crew points', 'Crew.dc.html'], ['6', 'badges', 'Badges.dc.html'], ['3', 'rewards', 'Rewards.dc.html']].map(([n, label, href]) => ({ n, label, href }));
    const rows = [
      { label: 'profile details', sub: 'view and edit your info', href: '#', icon: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4 21a8 8 0 0 1 16 0' },
      { label: 'my discounts', sub: 'codes, qr and redemptions', href: 'MyDiscounts.dc.html', icon: 'M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8ZM7.5 7.5h.01' },
      { label: 'the crew', sub: 'your code, invites, levels', href: 'Crew.dc.html', icon: 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM2 21v-1a6 6 0 0 1 12 0v1M16 3.5a4 4 0 0 1 0 7.5M22 21v-1a6 6 0 0 0-4-5.6' },
      { label: 'settings', sub: 'notifications, privacy, account', href: '#', icon: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM12 2v3M12 19v3M2 12h3M19 12h3' }
    ].map((r, i) => ({ ...r, line: i ? '1px solid #F0ECE2' : '0' }));
    return { accent, tiles, rows };
  }
}
</script>
</body>
</html>
