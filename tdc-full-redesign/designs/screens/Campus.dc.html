<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>campus</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#000000}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #FAF8F3; font-family: 'DM Sans', sans-serif; color: #111111; overflow: hidden">

<header style="padding: 22px 20px 0">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 0.2px; color: #6B675E">career dashboard</div>
<h1 style="margin: 2px 0 0; font-family: 'Outfit', sans-serif; font-size: 32px; font-weight: 800; letter-spacing: -1px">campus<span style="color: {{accent}}">.</span></h1>
<div style="font-size: 14px; color: #6B675E; margin-top: 2px">from campus to career.</div>
</header>

<section style="padding: 16px 16px 0">
<a href="Resume.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: 26px; background: #111111; color: #FFFFFF; text-decoration: none">
<span style="width: 64px; height: 64px; border-radius: 32px; background: conic-gradient({{accent}} 0 72%, #2A2925 72% 100%); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span style="width: 50px; height: 50px; border-radius: 25px; background: #111111; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 800; line-height: 1">72</span><span style="font-size: 9px; color: #A39E92">/100</span></span></span>
<span style="flex: 1"><span style="display: block; font-size: 12px; color: #A39E92">ats score</span><span style="display: block; font-weight: 700; font-size: 16px; margin-top: 2px">your resume is close.</span><span style="display: block; font-size: 13px; color: #CFCAC0; margin-top: 2px">optimize it to unlock better matches.</span></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>
</a>
</section>

<section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 10px 16px 0">
<sc-for list="{{modules}}" as="m" hint-placeholder-count="4">
<a href="{{m.href}}" style="height: 150px; border-radius: 24px; background: #FFFFFF; border: 1px solid #ECE7DB; padding: 14px; box-sizing: border-box; text-decoration: none; color: #111111; display: flex; flex-direction: column; justify-content: space-between">
<span style="display: flex; justify-content: space-between; align-items: flex-start">
<span style="width: 44px; height: 44px; border-radius: 14px; background: #F5F2EA; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{m.icon}}"></path></svg></span>
<span style="height: 24px; padding: 0 8px; border-radius: 12px; background: {{m.tagBg}}; font-size: 11px; font-weight: 800; display: flex; align-items: center">{{m.tag}}</span>
</span>
<span><span style="display: block; font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 800">{{m.title}}</span><span style="display: block; font-size: 12.5px; color: #6B675E; margin-top: 2px">{{m.sub}}</span></span>
</a>
</sc-for>
</section>

<section style="padding: 10px 16px 0">
<a href="Events.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 22px; background: #FFF1CC; text-decoration: none; color: #111111">
<span style="width: 44px; height: 44px; border-radius: 14px; background: #111111; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2ZM3 10h18M8 3v4M16 3v4"></path></svg></span>
<span style="flex: 1"><span style="display: block; font-weight: 700; font-size: 15px">meetups &amp; conferences</span><span style="display: block; font-size: 12.5px; color: #6B675E; margin-top: 2px">career fairs and scholarship events</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>
</a>
</section>

<div style="position: absolute; left: 0; bottom: 0"><dc-import name="Nav" active="campus" accent="{{accent}}" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>

      { title: 'resume.', sub: 'builder and templates', icon: 'M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9ZM14 3v6h6M8 13h8M8 17h5', tag: 'ats', tagBg: '#F0ECE2', href: 'Resume.dc.html' },
      { title: 'skillsshare.', sub: 'swap or teach a skill', icon: 'M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7', tag: 'new', tagBg: '#F0ECE2', href: 'Skills.dc.html' },
      { title: 'scholarships.', sub: 'study abroad, funded', icon: 'M2 9l10-5 10 5-10 5ZM6 11v5c0 2 3 4 6 4s6-2 6-4v-5', tag: 'hot', tagBg: accent, href: 'CareerHub.dc.html' }
    ];
    return { accent, modules };
  }
}
</script>
</body>
</html>
