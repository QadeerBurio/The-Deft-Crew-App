<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>brands</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#000000}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #FAF8F3; font-family: 'DM Sans', sans-serif; color: #111111; overflow: hidden">

<header style="display: flex; align-items: center; gap: 10px; padding: 18px 16px 0">
<a href="Explore.dc.html" aria-label="back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #ECE7DB; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; flex: 1; font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.8px">brands<span style="color: {{accent}}">.</span></h1>
<span style="height: 28px; padding: 0 10px; border-radius: 14px; background: #E8F5EC; color: #1E6B3A; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px"><span style="width: 7px; height: 7px; border-radius: 4px; background: #1E9E52"></span>live</span>
</header>

<div style="display: flex; gap: 8px; padding: 14px 16px 0">
<label style="flex: 1; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 24px; background: #FFFFFF; border: 1px solid #ECE7DB">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#736E65" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input aria-label="search brands" placeholder="search brands" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 15px; color: #111111">
</label>
<button aria-label="filters" style="width: 48px; height: 48px; border-radius: 24px; border: 0; background: #111111; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"></path></svg></button>
</div>

<div style="display: flex; gap: 8px; padding: 12px 16px 0; overflow: hidden">
<button style="flex-shrink: 0; height: 36px; padding: 0 12px; border-radius: 18px; border: 0; background: {{accent}}; font-weight: 700; font-size: 13.5px; display: flex; align-items: center; gap: 4px">karachi<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
<button onClick="{{c.pick}}" style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-weight: 600; font-size: 13.5px">{{c.label}}</button>
</sc-for>
</div>

<section style="padding: 16px 16px 0">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h2 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 17px; font-weight: 800">crew's privilege brands<span style="color: {{accent}}">.</span></h2>
</div>
<div style="display: flex; gap: 10px; margin-top: 10px; overflow: hidden">
<sc-for list="{{featured}}" as="f" hint-placeholder-count="3">
<a href="Offer.dc.html" style="flex: 0 0 150px; height: 120px; border-radius: 22px; background: #111111; color: #FFFFFF; padding: 12px; box-sizing: border-box; text-decoration: none; display: flex; flex-direction: column; justify-content: space-between">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 700; color: #6B675E">[LOGO]</span>
<span><span style="display: block; font-weight: 700; font-size: 14px">{{f.name}}</span><span style="display: block; font-size: 12px; color: {{accent}}; font-weight: 700; margin-top: 2px">{{f.off}}</span></span>
</a>
</sc-for>
</div>
</section>

<section style="padding: 16px 16px 0">
<h2 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 17px; font-weight: 800">all brands<span style="color: {{accent}}">.</span></h2>
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px">
<sc-for list="{{brands}}" as="b" hint-placeholder-count="4">
<a href="Offer.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 20px; background: #FFFFFF; border: 1px solid #ECE7DB; text-decoration: none; color: #111111">
<span style="width: 48px; height: 48px; border-radius: 14px; background: #F0ECE2; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 700; color: #6B675E; flex-shrink: 0">[LOGO]</span>
<span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 700; font-size: 15px">{{b.name}}</span><span style="display: block; font-size: 12.5px; color: #6B675E; margin-top: 2px">{{b.meta}}</span></span>
<span style="height: 28px; padding: 0 10px; border-radius: 14px; background: {{accent}}; font-size: 12px; font-weight: 800; display: flex; align-items: center">{{b.off}}</span>
</a>
</sc-for>
</div>
</section>

<div style="position: absolute; left: 0; bottom: 0"><dc-import name="Nav" active="explore" accent="{{accent}}" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F9C349"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { chip: 'all' }; }
  renderVals() {
    const accent = this.props.accent ?? '#F9C349';
    const chips = ['all', 'online only', 'max off', 'food', 'fashion'].map((label) => {
      const on = this.state.chip === label;
      return { label, bg: on ? '#111111' : '#FFFFFF', fg: on ? '#FFFFFF' : '#111111', border: on ? '#111111' : '#ECE7DB', pick: () => this.setState({ chip: label }) };
    });
    const featured = [{ name: 'Jenpharm', off: '10% off' }, { name: '[BRAND]', off: '[X]% off' }, { name: '[BRAND]', off: '[X]% off' }];
    const brands = [
      { name: '[BRAND]', meta: 'cafe · in-store · 1.2 km', off: '[X]% off' },
      { name: '[BRAND]', meta: 'fashion · online + in-store', off: '[X]% off' },
      { name: '[BRAND]', meta: 'gym · in-store · 4 km', off: '[X]% off' },
      { name: '[BRAND]', meta: 'salon · in-store · 6 km', off: '[X]% off' }
    ];
    return { accent, chips, featured, brands };
  }
}
</script>
</body>
</html>
