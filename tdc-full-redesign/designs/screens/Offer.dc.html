<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>offer details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#000000}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #FAF8F3; font-family: 'DM Sans', sans-serif; color: #111111; overflow: hidden">

<div style="height: 236px; background: #F0ECE2; position: relative; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #6B675E">[BRAND PHOTO]
<a href="Brands.dc.html" aria-label="back" style="position: absolute; left: 16px; top: 16px; width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
<button aria-label="share" style="position: absolute; right: 16px; top: 16px; width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 8l5-5 5 5M5 14v6h14v-6"></path></svg></button>
</div>

<section style="margin: -40px 16px 0; position: relative; border-radius: 26px; background: #FFFFFF; border: 1px solid #ECE7DB; padding: 18px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 52px; height: 52px; border-radius: 16px; background: #F0ECE2; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 700; color: #6B675E; flex-shrink: 0">[LOGO]</span>
<div style="flex: 1"><div style="font-weight: 700; font-size: 17px">[BRAND]</div><div style="font-size: 13px; color: #6B675E; margin-top: 2px">cafe · dha phase 6, karachi</div></div>
</div>
<div style="font-family: 'Outfit', sans-serif; font-size: 44px; font-weight: 800; letter-spacing: -1.4px; margin-top: 14px; line-height: 1">[X]% off<span style="color: {{accent}}">.</span></div>
<div style="display: flex; gap: 6px; margin-top: 12px">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
<button onClick="{{m.pick}}" style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid {{m.border}}; background: {{m.bg}}; color: {{m.fg}}; font-size: 13px; font-weight: 700">{{m.label}}</button>
</sc-for>
</div>
</section>

<section style="padding: 20px 20px 0">
<h2 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 800">how to redeem<span style="color: {{accent}}">.</span></h2>
<div style="display: flex; flex-direction: column; gap: 12px; margin-top: 12px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 32px; height: 32px; border-radius: 16px; background: {{s.bg}}; color: {{s.fg}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; flex-shrink: 0">{{s.n}}</span>
<span style="font-size: 15px">{{s.text}}</span>
</div>
</sc-for>
</div>
<a href="#" style="margin-top: 16px; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #ECE7DB; text-decoration: none; color: #111111">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12ZM12 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"></path></svg>
<span style="flex: 1; font-size: 14px; font-weight: 600">open in maps</span>
<span style="font-size: 13px; color: #6B675E">1.2 km</span>
</a>
</section>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 28px; background: #FAF8F3; border-top: 1px solid #ECE7DB">
<a href="Claimed.dc.html" style="height: 56px; border-radius: 28px; background: #111111; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6v6H4ZM14 4h6v6h-6ZM4 14h6v6H4ZM14 14h2v2h-2ZM18 18h2v2h-2ZM14 18h2M18 14h2"></path></svg>claim offer</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F9C349"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'in-store' }; }
  renderVals() {
    const accent = this.props.accent ?? '#F9C349';
    const store = this.state.mode === 'in-store';
    const modes = ['in-store', 'online'].map((label) => {
      const on = this.state.mode === label;
      return { label, bg: on ? '#111111' : '#FFFFFF', fg: on ? '#FFFFFF' : '#111111', border: on ? '#111111' : '#ECE7DB', pick: () => this.setState({ mode: label }) };
    });
    const texts = store
      ? ['claim the offer in the app.', 'scan the qr at the counter.', 'profile verified. sorted.']
      : ['claim the offer in the app.', 'generate your promo code.', 'paste it at checkout. sorted.'];
    const steps = texts.map((text, i) => ({ text, n: i + 1, bg: i === 2 ? accent : '#111111', fg: i === 2 ? '#111111' : '#FFFFFF' }));
    return { accent, modes, steps };
  }
}
</script>
</body>
</html>
