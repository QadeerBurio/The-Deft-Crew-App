<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rewards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#000000}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #FAF8F3; font-family: 'DM Sans', sans-serif; color: #111111; overflow: hidden">

<header style="display: flex; align-items: center; gap: 10px; padding: 18px 16px 0">
<a href="Crew.dc.html" aria-label="back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #ECE7DB; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; flex: 1; font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.8px">rewards<span style="color: {{accent}}">.</span></h1>
</header>

<section style="padding: 16px 16px 0">
<div style="border-radius: 28px; background: {{accent}}; padding: 20px; display: flex; align-items: center; gap: 12px">
<div style="flex: 1">
<div style="font-size: 11px; font-weight: 800; letter-spacing: 0.2px">your balance</div>
<div style="font-family: 'Outfit', sans-serif; font-size: 44px; font-weight: 800; letter-spacing: -1.4px; line-height: 1.05">860</div>
<div style="font-size: 13px; font-weight: 600">points ready to spend</div>
</div>
<span style="width: 72px; height: 72px; border-radius: 36px; background: #111111; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v9H4v-9M2 7h20v5H2ZM12 21V7M12 7a3 3 0 1 1 3-3c0 2-3 3-3 3ZM12 7a3 3 0 1 0-3-3c0 2 3 3 3 3Z"></path></svg></span>
</div>
</section>

<section style="padding: 16px 16px 0">
<h2 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 17px; font-weight: 800">spend your points<span style="color: {{accent}}">.</span></h2>
<div style="display: flex; gap: 10px; margin-top: 10px; overflow: hidden">
<sc-for list="{{perks}}" as="p" hint-placeholder-count="3">
<a href="#" style="flex: 0 0 150px; border-radius: 22px; background: #FFFFFF; border: 1px solid #ECE7DB; padding: 12px; box-sizing: border-box; text-decoration: none; color: #111111">
<span style="display: flex; height: 64px; border-radius: 14px; background: #F0ECE2; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #6B675E">[PERK]</span>
<span style="display: block; font-weight: 700; font-size: 14px; margin-top: 8px">{{p.name}}</span>
<span style="display: inline-flex; margin-top: 6px; height: 24px; padding: 0 8px; border-radius: 12px; background: #111111; color: {{accent}}; font-size: 11.5px; font-weight: 800; align-items: center">{{p.cost}} pts</span>
</a>
</sc-for>
</div>
</section>

<section style="padding: 16px 16px 0">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h2 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 17px; font-weight: 800">recent activity<span style="color: {{accent}}">.</span></h2>
<a href="#" style="font-size: 13px; font-weight: 600; color: #6B675E; text-decoration: none">view all</a>
</div>
<div style="border-radius: 22px; background: #FFFFFF; border: 1px solid #ECE7DB; margin-top: 10px; overflow: hidden">
<sc-for list="{{tx}}" as="t" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; height: 58px; padding: 0 14px; border-top: {{t.line}}">
<span style="width: 34px; height: 34px; border-radius: 12px; background: #F5F2EA; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.icon}}"></path></svg></span>
<span style="flex: 1"><span style="display: block; font-weight: 700; font-size: 14px">{{t.label}}</span><span style="display: block; font-size: 12px; color: #6B675E">{{t.when}}</span></span>
<span style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 16px; color: {{t.c}}">{{t.pts}}</span>
</div>
</sc-for>
</div>
<a href="#" style="display: block; text-align: center; padding: 12px; font-size: 13px; font-weight: 600; color: #6B675E; text-decoration: none">export csv / excel</a>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F9C349"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#F9C349';
    const perks = [{ name: 'free coffee at [BRAND]', cost: '300' }, { name: '[BRAND] voucher', cost: '500' }, { name: 'event pass', cost: '800' }];
    const tx = [
      { icon: 'M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8ZM7.5 7.5h.01', label: 'redeemed at [BRAND]', when: 'today', pts: '+[X]', c: '#1E6B3A' },
      { icon: 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM2 21v-1a6 6 0 0 1 12 0v1M16 3.5a4 4 0 0 1 0 7.5M22 21v-1a6 6 0 0 0-4-5.6', label: 'friend joined with your code', when: 'yesterday', pts: '+[X]', c: '#1E6B3A' },
      { icon: 'M20 12v9H4v-9M2 7h20v5H2ZM12 21V7M12 7a3 3 0 1 1 3-3c0 2-3 3-3 3ZM12 7a3 3 0 1 0-3-3c0 2 3 3 3 3Z', label: 'spent on free coffee', when: '[DATE]', pts: '-300', c: '#111111' },
      { icon: 'M12 22c4 0 7-3 7-7 0-4-3-6-4-10-2 2-3 4-3 6-1-1-2-2-2-4-3 3-5 5-5 8 0 4 3 7 7 7Z', label: 'weekly streak kept', when: '[DATE]', pts: '+[X]', c: '#1E6B3A' }
    ].map((t, i) => ({ ...t, line: i ? '1px solid #F0ECE2' : '0' }));
    return { accent, perks, tx };
  }
}
</script>
</body>
</html>
