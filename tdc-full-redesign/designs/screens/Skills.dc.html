<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>skillsshare dashboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#000000}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #FAF8F3; font-family: 'DM Sans', sans-serif; color: #111111; overflow: hidden">

<header style="display: flex; align-items: center; gap: 10px; padding: 18px 16px 0">
<a href="Campus.dc.html" aria-label="back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #ECE7DB; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; flex: 1; font-family: 'Outfit', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -0.8px">skillsshare<span style="color: {{accent}}">.</span></h1>
<button aria-label="matches and messages" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #ECE7DB; background: #FFFFFF; position: relative; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.8 7L4 20l1-4.6A8 8 0 1 1 21 12Z"></path></svg><span style="position: absolute; top: 9px; right: 9px; width: 8px; height: 8px; border-radius: 4px; background: {{accent}}"></span></button>
</header>

<section style="padding: 16px 16px 0">
<div style="border-radius: 26px; background: {{accent}}; padding: 18px; display: flex; align-items: center; gap: 12px">
<div style="flex: 1">
<div style="font-family: 'Outfit', sans-serif; font-size: 21px; font-weight: 800; line-height: 1.15">know something? trade it.</div>
<div style="font-size: 13.5px; margin-top: 4px">swap a skill, or get paid to teach it.</div>
<a href="#" style="margin-top: 12px; display: inline-flex; height: 40px; padding: 0 16px; border-radius: 20px; background: #111111; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 13.5px; align-items: center">create listing</a>
</div>
<span style="width: 72px; height: 72px; border-radius: 36px; background: rgba(255,255,255,0.55); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"></path></svg></span>
</div>
</section>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 10px 16px 0">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
<div style="border-radius: 18px; background: #FFFFFF; border: 1px solid #ECE7DB; padding: 12px 6px; text-align: center">
<div style="font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 800">{{s.n}}</div>
<div style="font-size: 12px; color: #6B675E">{{s.label}}</div>
</div>
</sc-for>
</div>

<div style="padding: 14px 16px 0">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 24px; background: #F0ECE2">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
<button onClick="{{m.pick}}" style="height: 40px; border-radius: 20px; border: 0; background: {{m.bg}}; color: {{m.fg}}; font-weight: {{m.weight}}; font-size: 14px">{{m.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 0">
<sc-for list="{{list}}" as="s" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 20px; background: #FFFFFF; border: 1px solid #ECE7DB">
<span style="width: 44px; height: 44px; border-radius: 22px; background: #FFF1CC; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; flex-shrink: 0">{{s.i}}</span>
<span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 700; font-size: 14.5px">{{s.skill}}</span><span style="display: block; font-size: 12px; color: #6B675E; margin-top: 2px">{{s.who}}</span>
<span style="display: inline-flex; margin-top: 6px; height: 22px; padding: 0 8px; border-radius: 11px; background: {{s.tagBg}}; color: {{s.tagFg}}; font-size: 11.5px; font-weight: 700; align-items: center">{{s.terms}}</span></span>
<button style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #111111; background: #FFFFFF; font-weight: 700; font-size: 13px; color: #111111">{{action}}</button>
</div>
</sc-for>
</div>

<div style="position: absolute; left: 0; bottom: 0"><dc-import name="Nav" active="campus" accent="{{accent}}" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F9C349"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'explore' }; }
  renderVals() {
    const accent = this.props.accent ?? '#F9C349';
    const modes = ['explore', 'my activity'].map((label) => {
      const on = this.state.mode === label;
      return { label, bg: on ? '#111111' : 'transparent', fg: on ? '#FFFFFF' : '#111111', weight: on ? 700 : 600, pick: () => this.setState({ mode: label }) };
    });
    const stats = [['3', 'active'], ['2', 'pending'], ['rs [X]', 'earned']].map(([n, label]) => ({ n, label }));
    const swap = { tagBg: '#FFF1CC', tagFg: '#111111' };
    const paid = { tagBg: '#111111', tagFg: accent };
    const explore = [
      { i: 'Z', skill: 'canva for beginners', who: '[NAME] · [UNIVERSITY]', terms: 'swap for: excel', ...swap },
      { i: 'U', skill: 'python basics', who: '[NAME] · [UNIVERSITY]', terms: 'rs [X] / session', ...paid },
      { i: 'M', skill: 'ielts speaking prep', who: '[NAME] · [UNIVERSITY]', terms: 'rs [X] / session', ...paid }
    ];
    const mine = [
      { i: 'A', skill: 'video editing (your listing)', who: '2 offers waiting', terms: 'swap or paid', ...swap },
      { i: 'A', skill: 'request: figma basics', who: 'matched with [NAME]', terms: 'swap for: canva', ...swap },
      { i: 'A', skill: 'offer: a levels physics', who: 'pending reply', terms: 'rs [X] / session', ...paid }
    ];
    const ex = this.state.mode === 'explore';
    return { accent, modes, stats, list: ex ? explore : mine, action: ex ? 'request' : 'manage' };
  }
}
</script>
</body>
</html>
