<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>events</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#000000}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #FAF8F3; font-family: 'DM Sans', sans-serif; color: #111111; overflow: hidden">

<header style="display: flex; align-items: center; gap: 10px; padding: 18px 16px 0">
<a href="Explore.dc.html" aria-label="back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #ECE7DB; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; flex: 1; font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.8px">events<span style="color: {{accent}}">.</span></h1>
<button aria-label="create event" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 0; background: #111111; color: #FFFFFF; font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>create</button>
</header>

<div style="display: flex; gap: 8px; padding: 14px 16px 0; overflow: hidden">
<button style="flex-shrink: 0; height: 36px; padding: 0 12px; border-radius: 18px; border: 0; background: {{accent}}; font-weight: 700; font-size: 13.5px; display: flex; align-items: center; gap: 4px">all cities<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
<sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
<button onClick="{{c.pick}}" style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-weight: 600; font-size: 13.5px">{{c.label}}</button>
</sc-for>
</div>

<section style="padding: 16px 16px 0">
<div style="border-radius: 28px; background: #111111; color: #FFFFFF; overflow: hidden">
<div style="height: 140px; background: #2A2925; position: relative; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #736E65">[EVENT BANNER 16:9]
<span style="position: absolute; left: 14px; top: 14px; height: 28px; padding: 0 10px; border-radius: 14px; background: {{accent}}; color: #111111; font-size: 12px; font-weight: 800; display: flex; align-items: center">sat 11 oct · 7 pm</span>
<span style="position: absolute; right: 14px; top: 14px; height: 28px; padding: 0 10px; border-radius: 14px; background: #FFFFFF; color: #111111; font-size: 12px; font-weight: 700; display: flex; align-items: center">prize pool rs [X]</span>
</div>
<div style="padding: 16px">
<div style="font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 800">[EVENT TITLE]</div>
<div style="font-size: 13.5px; color: #CFCAC0; margin-top: 4px">[VENUE] · karachi · teams of [N]</div>
<div style="display: flex; gap: 8px; margin-top: 14px">
<button onClick="{{reg}}" style="flex: 1; height: 46px; border-radius: 23px; border: 0; background: {{regBg}}; color: #111111; font-weight: 800; font-size: 14px">{{regLabel}}</button>
<span style="width: 46px; height: 46px; border-radius: 23px; border: 1px solid #2A2925; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4Z"></path></svg></span>
</div>
</div>
</div>
</section>

<section style="padding: 16px 16px 0">
<h2 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 17px; font-weight: 800">coming up<span style="color: {{accent}}">.</span></h2>
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px">
<sc-for list="{{events}}" as="e" hint-placeholder-count="3">
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 20px; background: #FFFFFF; border: 1px solid #ECE7DB; text-decoration: none; color: #111111">
<span style="width: 50px; height: 54px; border-radius: 16px; background: #FFF1CC; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0"><span style="font-size: 10.5px; font-weight: 700">{{e.dow}}</span><span style="font-family: 'Outfit', sans-serif; font-size: 19px; font-weight: 800">{{e.date}}</span></span>
<span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 700; font-size: 15px">{{e.name}}</span><span style="display: block; font-size: 12.5px; color: #6B675E; margin-top: 2px">{{e.meta}}</span></span>
<span style="height: 24px; padding: 0 8px; border-radius: 12px; background: #F0ECE2; font-size: 11px; font-weight: 700; display: flex; align-items: center">{{e.kind}}</span>
</a>
</sc-for>
</div>
</section>

<div style="position: absolute; left: 0; bottom: 0"><dc-import name="Nav" active="explore" accent="{{accent}}" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F9C349"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cat: 'all', registered: false }; }
  renderVals() {
    const accent = this.props.accent ?? '#F9C349';
    const cats = ['all', 'hackathons', 'career', 'concerts', 'sports'].map((label) => {
      const on = this.state.cat === label;
      return { label, bg: on ? '#111111' : '#FFFFFF', fg: on ? '#FFFFFF' : '#111111', border: on ? '#111111' : '#ECE7DB', pick: () => this.setState({ cat: label }) };
    });
    const events = [
      { dow: 'sun', date: 12, name: '[EVENT NAME]', meta: '[VENUE] · 5 pm', kind: 'external' },
      { dow: 'wed', date: 15, name: '[CAREER FAIR]', meta: '[UNIVERSITY] · 11 am', kind: 'free' },
      { dow: 'fri', date: 17, name: '[MEETUP]', meta: '[VENUE] · lahore · 6 pm', kind: 'team' }
    ];
    const r = this.state.registered;
    return { accent, cats, events, regLabel: r ? 'registered. sorted.' : 'register', regBg: r ? '#FFFFFF' : accent, reg: () => this.setState({ registered: !r }) };
  }
}
</script>
</body>
</html>
