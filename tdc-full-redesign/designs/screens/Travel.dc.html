<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>travel ai</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#000000}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #FAF8F3; font-family: 'DM Sans', sans-serif; color: #111111; overflow: hidden">

<header style="display: flex; align-items: center; gap: 10px; padding: 18px 16px 0">
<a href="Explore.dc.html" aria-label="back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #ECE7DB; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
<span style="width: 40px; height: 40px; border-radius: 20px; background: #111111; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2Z"></path></svg></span>
<span style="flex: 1"><span style="display: block; font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 800">travel ai<span style="color: {{accent}}">.</span></span><span style="display: flex; align-items: center; gap: 5px; font-size: 12px; color: #6B675E"><span style="width: 6px; height: 6px; border-radius: 3px; background: #1E9E52"></span>here 24/7</span></span>
<button aria-label="chat history" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #ECE7DB; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"></path></svg></button>
</header>

<div style="padding: 20px 16px 0; display: flex; flex-direction: column; gap: 12px">
<div style="align-self: flex-end; max-width: 270px; padding: 12px 14px; border-radius: 20px 20px 6px 20px; background: #111111; color: #FFFFFF; font-size: 15px; line-height: 1.45">3 day trip to hunza with 4 friends. budget around [RS] each.</div>

<div style="align-self: flex-start; width: 310px; padding: 14px; border-radius: 20px 20px 20px 6px; background: #FFFFFF; border: 1px solid #ECE7DB">
<div style="font-weight: 700; font-size: 15px">sorted. here's a plan.</div>
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="3">
<div style="display: flex; gap: 10px; align-items: flex-start">
<span style="flex-shrink: 0; height: 24px; padding: 0 8px; border-radius: 12px; background: {{accent}}; font-size: 12px; font-weight: 800; display: flex; align-items: center">{{d.day}}</span>
<span style="font-size: 14px; line-height: 1.4">{{d.plan}}</span>
</div>
</sc-for>
</div>
<div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #F0ECE2; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; text-align: center">
<div><div style="font-size: 11px; color: #6B675E">travel</div><div style="font-weight: 700; font-size: 13px">[RS]</div></div>
<div><div style="font-size: 11px; color: #6B675E">stay</div><div style="font-weight: 700; font-size: 13px">[RS]</div></div>
<div><div style="font-size: 11px; color: #6B675E">food</div><div style="font-weight: 700; font-size: 13px">[RS]</div></div>
</div>
</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 28px; background: #FAF8F3">
<div style="display: flex; gap: 8px; overflow: hidden; margin-bottom: 10px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
<button style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #ECE7DB; background: #FFFFFF; font-size: 13px; font-weight: 600; color: #111111">{{c}}</button>
</sc-for>
</div>
<div style="height: 56px; border-radius: 28px; background: #FFFFFF; border: 1px solid #ECE7DB; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 18px">
<input aria-label="message travel ai" placeholder="where to next?" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 15px; color: #111111">
<button aria-label="send" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #111111; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button>
</div>
<div style="text-align: center; font-size: 11.5px; color: #736E65; margin-top: 8px">tdc ai plans it. you book it.</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F9C349"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const days = [
      { day: 'day 1', plan: 'islamabad to [STOP]. leave early, overnight in [TOWN].' },
      { day: 'day 2', plan: 'up to karimabad. sunset at [VIEWPOINT].' },
      { day: 'day 3', plan: 'attabad lake in the morning, head back by noon.' }
    ];
    return { accent: this.props.accent ?? '#F9C349', days, chips: ['make it cheaper', 'packing list', 'best season', 'share with crew'] };
  }
}
</script>
</body>
</html>
