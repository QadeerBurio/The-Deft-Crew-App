<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tdc deal, balanced</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.tap{transition:transform .14s ease}
.tap:active{transform:scale(.97)}
.fill{transition:width 1.1s linear}
.unfill{transition:width .25s ease-out}
@keyframes popIn{0%{transform:scale(0)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes fadeUp{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
@keyframes fall{0%{transform:translateY(-40px) rotate(0)}100%{transform:translateY(900px) rotate(360deg)}}
@keyframes slideIn{0%{transform:translateX(140%)}100%{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FAF8F3; font-family: 'DM Sans', sans-serif; color: #111111">

<div style="height: 300px; position: relative; overflow: hidden; border-radius: 0 0 28px 28px">
<dc-import name="Photo" kind="coffee" w="390px" h="300px" art="62%" hint-size="390px,300px"></dc-import>
<a href="Balanced.dc.html" class="tap" aria-label="back" style="position: absolute; left: 16px; top: 14px; width: 42px; height: 42px; border-radius: 21px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
<button onClick="{{toggleSave}}" class="tap" aria-label="save deal" style="position: absolute; right: 16px; top: 14px; width: 42px; height: 42px; border-radius: 21px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="{{saveFill}}" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10Z"></path></svg></button>
</div>

<section style="padding: 18px 20px 0">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 48px; height: 48px; border-radius: 14px; background: #111111; color: {{accent}}; display: flex; align-items: center; justify-content: center; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 20px">C</span>
<span style="flex: 1"><span style="display: block; font-weight: 700; font-size: 17px">[Cafe]</span><span style="display: block; font-size: 13px; color: #6B675E">dha phase 6 · 1.2 km · open till 1 am</span></span>
</div>
<div style="display: flex; align-items: baseline; gap: 10px; margin-top: 16px">
<span style="font-family: 'Outfit', sans-serif; font-size: 46px; font-weight: 800; letter-spacing: -1.6px; line-height: 1">25% off</span>
<span style="height: 26px; padding: 0 10px; border-radius: 13px; background: #FFF1CC; font-size: 12px; font-weight: 700; display: flex; align-items: center">every visit</span>
</div>
<div style="font-size: 15px; color: #6B675E; margin-top: 6px">coffee and any dessert, dine-in or takeaway.</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 18px">
<sc-for list="{{facts}}" as="f" hint-placeholder-count="3">
<div style="border-radius: 16px; background: #FFFFFF; border: 1px solid #ECE7DB; padding: 10px 12px">
<div style="font-size: 11.5px; color: #6B675E">{{f.k}}</div>
<div style="font-weight: 700; font-size: 14px; margin-top: 2px">{{f.v}}</div>
</div>
</sc-for>
</div>
</section>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 28px; background: #FAF8F3; border-top: 1px solid #ECE7DB">
<div style="font-size: 12.5px; color: #6B675E; text-align: center; margin-bottom: 10px">{{hint}}</div>
<button onMouseDown="{{holdStart}}" onMouseUp="{{holdEnd}}" onMouseLeave="{{holdEnd}}" onTouchStart="{{holdStart}}" onTouchEnd="{{holdEnd}}" aria-label="press and hold to claim" style="position: relative; width: 100%; height: 58px; border-radius: 29px; border: 0; background: #111111; overflow: hidden; padding: 0; transform: {{scale}}; transition: transform .15s ease">
<span class="{{fillClass}}" style="position: absolute; left: 0; top: 0; bottom: 0; width: {{fillW}}; background: {{accent}}"></span>
<span style="position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 700; font-size: 16px; color: {{fg}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{fg}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6v6H4ZM14 4h6v6h-6ZM4 14h6v6H4ZM14 14h2v2h-2ZM18 18h2v2h-2ZM14 18h2M18 14h2"></path></svg>{{label}}</span>
</button>
</div>

<sc-if value="{{sorted}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: {{accent}}; overflow: hidden; z-index: 20">
<sc-for list="{{confetti}}" as="p" hint-placeholder-count="0">
<span style="position: absolute; top: 0; left: {{p.left}}; width: {{p.size}}; height: {{p.size}}; border-radius: 50%; background: {{p.color}}; animation: fall {{p.dur}} {{p.delay}} ease-in both"></span>
</sc-for>
<div style="position: relative; display: flex; flex-direction: column; align-items: center; padding-top: 110px">
<div style="animation: popIn .6s .05s cubic-bezier(.3,1.4,.5,1) both"><dc-import name="Dot" mood="sorted" size="140" hint-size="140px,140px"></dc-import></div>
<h1 style="margin: 18px 0 0; font-family: 'Outfit', sans-serif; font-size: 64px; font-weight: 900; letter-spacing: -2.5px; line-height: 1; animation: fadeUp .45s .3s ease-out both">sorted.</h1>
<p style="margin: 8px 0 0; font-size: 16px; font-weight: 600; animation: fadeUp .45s .4s ease-out both">25% off at [Cafe]. show this at the counter.</p>
</div>
<div style="margin: 30px 20px 0; border-radius: 22px; background: #FFFFFF; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; animation: fadeUp .45s .55s ease-out both">
<div><div style="font-size: 12.5px; color: #6B675E">you saved</div><div style="font-family: 'Outfit', sans-serif; font-size: 32px; font-weight: 800; letter-spacing: -1px">rs {{saved}}</div></div>
<span style="height: 32px; padding: 0 12px; border-radius: 16px; background: #111111; color: {{accent}}; font-weight: 800; font-size: 14px; display: flex; align-items: center; animation: slideIn .45s 1.2s cubic-bezier(.2,1.3,.4,1) both">+50 pts</span>
</div>
<div style="position: absolute; left: 20px; right: 20px; bottom: 30px; display: flex; gap: 10px; animation: fadeUp .45s .8s ease-out both">
<a href="Balanced.dc.html" class="tap" style="flex: 1; height: 54px; border-radius: 27px; border: 1.5px solid #111111; color: #111111; text-decoration: none; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center">done</a>
<button onClick="{{again}}" class="tap" style="flex: 1.3; height: 54px; border-radius: 27px; border: 0; background: #111111; color: #FFFFFF; font-weight: 700; font-size: 15px">share</button>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F9C349"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { holding: false, sorted: false, saved: 0, fav: false }; }
  componentWillUnmount() { if (this.holdT) clearTimeout(this.holdT); if (this.counter) clearInterval(this.counter); }
  count(target) {
    if (this.counter) clearInterval(this.counter);
    let v = 0;
    this.counter = setInterval(() => { v = Math.min(target, v + Math.ceil(target / 24)); this.setState({ saved: v }); if (v >= target) clearInterval(this.counter); }, 32);
  }
  renderVals() {
    const accent = this.props.accent ?? '#F9C349';
    const s = this.state;
    const colors = ['#111111', '#FFFFFF', '#111111'];
    const confetti = s.sorted ? Array.from({ length: 18 }, (_, i) => ({
      left: ((i * 41) % 100) + '%', size: (6 + ((i * 5) % 8)) + 'px', color: colors[i % 3],
      dur: (1.8 + ((i * 13) % 10) / 10) + 's', delay: (((i * 17) % 10) / 20) + 's'
    })) : [];
    return {
      accent,
      facts: [{ k: 'claimed today', v: '38 students' }, { k: 'valid', v: 'every visit' }, { k: 'how', v: 'scan at counter' }],
      saveFill: s.fav ? accent : 'none',
      toggleSave: () => this.setState({ fav: !s.fav }),
      holdStart: () => {
        if (s.sorted) return;
        this.setState({ holding: true });
        if (this.holdT) clearTimeout(this.holdT);
        this.holdT = setTimeout(() => { this.setState({ sorted: true, holding: false, saved: 0 }); this.count(340); }, 1000);
      },
      holdEnd: () => { if (this.holdT) clearTimeout(this.holdT); if (s.holding) this.setState({ holding: false }); },
      fillW: s.holding ? '100%' : '0%', fillClass: s.holding ? 'fill' : 'unfill',
      scale: s.holding ? 'scale(0.98)' : 'scale(1)',
      fg: s.holding ? '#111111' : '#FFFFFF',
      label: s.holding ? 'keep holding' : 'hold to claim',
      hint: s.holding ? 'almost there' : 'at the counter? press and hold',
      sorted: s.sorted, confetti, saved: s.saved,
      again: () => this.setState({ sorted: false, saved: 0 })
    };
  }
}
</script>
</body>
</html>
