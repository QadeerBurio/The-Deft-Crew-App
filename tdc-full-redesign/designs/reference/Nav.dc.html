<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tdc tab bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav style="width: 390px; height: 84px; background: #FFFFFF; border-top: 1px solid #ECE7DB; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; padding-top: 10px; box-sizing: border-box; font-family: 'DM Sans', sans-serif">
<sc-for list="{{items}}" as="t" hint-placeholder-count="5">
<sc-if value="{{t.center}}" hint-placeholder-val="{{ false }}">
<a href="Social.dc.html" aria-label="social" style="justify-self: center; width: 60px; height: 60px; margin-top: -28px; border-radius: 30px; background: #111111; display: flex; align-items: center; justify-content: center; border: 4px solid #FFFFFF; box-shadow: 0 6px 18px rgba(17,17,17,0.18)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.8 7L4 20l1-4.6A8 8 0 1 1 21 12Z"></path><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"></path></svg></a>
</sc-if>
<sc-if value="{{t.side}}" hint-placeholder-val="{{ true }}">
<a href="{{t.href}}" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; text-decoration: none; color: {{t.color}}; font-size: 11px; font-weight: {{t.weight}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{t.color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.icon}}"></path></svg>{{t.label}}<span style="width: 5px; height: 5px; border-radius: 50%; background: {{t.dot}}"></span></a>
</sc-if>
</sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","explore","social","campus","profile"],"default":"home"},"accent":{"editor":null},"$preview":{"width":390,"height":84}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#F9C349';
    const active = this.props.active ?? 'home';
    const base = [
      { key: 'home', label: 'home', href: 'Main.dc.html', icon: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1Z' },
      { key: 'explore', label: 'explore', href: 'Explore.dc.html', icon: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18ZM15.5 8.5l-2 5-5 2 2-5Z' },
      { key: 'social', center: true },
      { key: 'campus', label: 'campus', href: 'Campus.dc.html', icon: 'M2 9l10-5 10 5-10 5ZM6 11v5c0 2 3 4 6 4s6-2 6-4v-5' },
      { key: 'profile', label: 'profile', href: 'Profile.dc.html', icon: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4 21a8 8 0 0 1 16 0' }
    ];
    const items = base.map((t) => {
      const on = t.key === active;
      return { ...t, center: !!t.center, side: !t.center, color: on ? '#111111' : '#736E65', weight: on ? 700 : 500, dot: on ? accent : 'transparent' };
    });
    return { items, accent };
  }
}
</script>
</body>
</html>
