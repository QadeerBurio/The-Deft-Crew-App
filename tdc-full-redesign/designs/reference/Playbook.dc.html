<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>behaviour playbook</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1200px; height: 844px; background: #FAF8F3; font-family: 'DM Sans', sans-serif; color: #111111; padding: 40px 44px; box-sizing: border-box; display: flex; flex-direction: column; gap: 26px">

<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div>
<div style="font-size: 12px; font-weight: 700; letter-spacing: 0.2px; color: #6B675E">behaviour playbook</div>
<h1 style="margin: 6px 0 0; font-family: 'Outfit', sans-serif; font-size: 44px; font-weight: 800; letter-spacing: -1.6px">why students come back<span style="color: {{accent}}">.</span></h1>
</div>
<div style="max-width: 380px; padding: 14px 18px; border-radius: 18px; background: #111111; color: #F5F2EA">
<div style="font-size: 12px; color: #A39E92">north star</div>
<div style="font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 800; margin-top: 2px">weekly sorted students<span style="color: {{accent}}">.</span></div>
<div style="font-size: 12.5px; color: #CFCAC0; margin-top: 4px">students who redeem, apply, post or plan at least once a week.</div>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{rules}}" as="r" hint-placeholder-count="6">
<div style="border-radius: 22px; background: #FFFFFF; border: 1px solid #ECE7DB; padding: 18px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 30px; height: 30px; border-radius: 15px; background: #111111; color: {{accent}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px">{{r.n}}</span>
<span style="font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 800">{{r.name}}</span>
</div>
<div style="font-size: 14px; line-height: 1.45">{{r.why}}</div>
<div style="font-size: 13px; color: #6B675E; line-height: 1.45"><b style="color: #111111">in tdc:</b> {{r.where}}</div>
<div style="align-self: flex-start; margin-top: 2px; height: 26px; padding: 0 10px; border-radius: 13px; background: #FFF1CC; font-size: 12px; font-weight: 700; display: flex; align-items: center">track: {{r.metric}}</div>
</div>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<div style="border-radius: 22px; background: #111111; color: #F5F2EA; padding: 18px 22px">
<div style="font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 800">no guilt. ever<span style="color: {{accent}}">.</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 20px; margin-top: 10px; font-size: 13.5px; color: #CFCAC0">
<sc-for list="{{guard}}" as="g" hint-placeholder-count="6"><div>{{g}}</div></sc-for>
</div>
</div>
<div style="border-radius: 22px; background: #FFFFFF; border: 1px solid #ECE7DB; padding: 18px 22px">
<div style="font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 800">measure weekly<span style="color: {{accent}}">.</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 20px; margin-top: 10px; font-size: 13.5px">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="6"><div>{{k}}</div></sc-for>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F9C349"},"$preview":{"width":1200,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rules = [
      { mood: 'excited', name: 'fast first win.', why: 'people stay when they get value in the first session, not the first week.', where: 'first run asks what the noise is, then home opens on that exact problem.', metric: 'time to first sorted' },
      { mood: 'sorted', name: 'head start.', why: 'progress that already has a start (endowed progress) gets finished more often.', where: 'picking your 3 problems counts as your first sorted. you never start at zero.', metric: 'day 7 retention' },
      { mood: 'panic', name: 'open loops.', why: 'unfinished things stay on the mind (zeigarnik effect).', where: 'unsorted dots keep their mood, quietly, until used. no nagging badges.', metric: 'features used per student' },
      { mood: 'broke', name: 'make savings visible.', why: 'money saved feels real when it is counted and shown.', where: '"saved this month" on home and on every sorted moment.', metric: 'redemptions per student' },
      { mood: 'cheeky', name: 'end on a high.', why: 'people remember the peak and the end of an experience (peak-end rule).', where: 'the yellow sorted screen after every redemption, with a share card.', metric: 'shares and invites' },
      { mood: 'sus', name: 'right moment.', why: 'a cue that matches the moment works better than a generic push.', where: 'home changes by time and season: lunch, weekends, exams.', metric: 'push to open rate' }
    ];
    const guard = ['weekly streaks, not daily.', 'no fake countdowns.', 'no red badge spam.', '3 pushes a week, max.', 'every push is useful or silent.', 'one ask per screen.'];
    const kpis = ['weekly sorted students', 'day 1 · day 7 · day 30 retention', 'time to first sorted', 'redemptions per active student', 'invites per active student', 'features sorted per student'];
    return { accent: this.props.accent ?? '#F9C349', rules: rules.map((r, i) => ({ ...r, n: i + 1 })), guard, kpis };
  }
}
</script>
</body>
</html>
