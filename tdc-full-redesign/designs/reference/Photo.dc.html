</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["coffee","burger","sneaker","gym","skincare","pizza"],"default":"coffee"},"w":{"editor":null,"default":"200px"},"h":{"editor":null,"default":"200px"},"r":{"editor":null,"default":"0px"},"art":{"editor":null,"default":"80%"},"$preview":{"width":200,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    const BG = {
      coffee: 'linear-gradient(160deg, #A0603A 0%, #4A2616 100%)',
      burger: 'linear-gradient(160deg, #F2683A 0%, #A3260F 100%)',
      sneaker: 'linear-gradient(160deg, #3E7BC0 0%, #17365A 100%)',
      gym: 'linear-gradient(160deg, #4FA06C 0%, #1E4A2E 100%)',
      skincare: 'linear-gradient(160deg, #F7C4CF 0%, #C9667E 100%)',
      pizza: 'linear-gradient(160deg, #F5C451 0%, #C2621B 100%)'
    };
    const k = BG[this.props.kind] ? this.props.kind : 'coffee';
    return {
      bg: BG[k], w: this.props.w ?? '200px', h: this.props.h ?? '200px', r: this.props.r ?? '0px', art: this.props.art ?? '80%',
      coffee: k === 'coffee', burger: k === 'burger', sneaker: k === 'sneaker', gym: k === 'gym', skincare: k === 'skincare', pizza: k === 'pizza'
    };
  }
}
</script>
